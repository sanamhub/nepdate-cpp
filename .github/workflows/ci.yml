# The jobs of ADR-0004 §4. Each job runs its gates through
# tools/ci.cmake with STRICT=ON, so a missing tool fails the job instead of skipping a gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # shared-sync starts CI this way on the PR it opens with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-2026:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-msvc-2026-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Gates 3 to 5 and ASan, Debug
        run: cmake "-DONLY=codegen,build-and-test,no-exceptions,sanitizers" -DSTRICT=ON -P tools/ci.cmake
      - name: Configure Release
        run: cmake --preset release
      - name: Build Release
        run: cmake --build --preset release
      - name: Test Release
        run: ctest --preset release

  msvc-2022:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-msvc-2022-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Gates 4 and 5
        run: cmake "-DONLY=build-and-test,no-exceptions" -DSTRICT=ON -P tools/ci.cmake

  gcc:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: GCC 12 on the oldest runner image.
          - version: 12
            runner: ubuntu-24.04
          - version: 14
            runner: ubuntu-24.04
          - version: 15
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CC: gcc-${{ matrix.version }}
      CXX: g++-${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-${{ matrix.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-gcc-${{ matrix.version }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gates 4 and 5
        run: cmake -DONLY=build-and-test,no-exceptions -DSTRICT=ON -P tools/ci.cmake

  clang:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: Clang 16 with the system libstdc++.
          - version: 16
            stdlib: libstdc++
            flags: ""
            runner: ubuntu-24.04
          - version: 18
            stdlib: libc++
            flags: -stdlib=libc++
            runner: ubuntu-24.04
          - version: 22
            stdlib: libc++
            flags: -stdlib=libc++
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CC: clang-${{ matrix.version }}
      CXX: clang++-${{ matrix.version }}
      # Also reaches the vcpkg port builds, so Catch2 uses the same standard library.
      CXXFLAGS: ${{ matrix.flags }}
      LDFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang ${{ matrix.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-${{ matrix.version }}
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y libc++-${{ matrix.version }}-dev libc++abi-${{ matrix.version }}-dev
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-clang-${{ matrix.version }}-${{ matrix.stdlib }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gates 4 and 5
        run: cmake -DONLY=build-and-test,no-exceptions -DSTRICT=ON -P tools/ci.cmake

  apple:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install ninja
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gates 4, 5 and 7
        run: cmake -DONLY=build-and-test,no-exceptions,sanitizers -DSTRICT=ON -P tools/ci.cmake

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 18 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-format-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-lint-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gates 1, 2, 3 and 10
        run: cmake -DONLY=format,ascii,codegen,docs -DSTRICT=ON -P tools/ci.cmake

  # clang-tidy 22 comes from the Ubuntu 26.04 archive, like Clang 22 in the sanitizers job.
  tidy:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang-tidy 22 and Clang 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-22 clang-tidy-22
          # The tidy preset calls plain clang-tidy.
          sudo ln -sf /usr/bin/clang-tidy-22 /usr/local/bin/clang-tidy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-tidy-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gate 6
        run: cmake -DONLY=tidy -DSTRICT=ON -P tools/ci.cmake

  sanitizers:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-22
          # Hosted runner kernels may use 32 random mmap bits, which ASan and TSan can't map.
          sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-sanitizers-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gate 7
        run: cmake -DONLY=sanitizers -DSTRICT=ON -P tools/ci.cmake
      - name: ThreadSanitizer
        run: |
          cmake --preset tsan
          cmake --build --preset tsan
          ctest --preset tsan

  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: gcc-15
      CXX: g++-15
      GCOV: gcov-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC 15 and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-15
          pipx install gcovr==8.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-coverage-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gate 8
        run: cmake -DONLY=coverage -DSTRICT=ON -P tools/ci.cmake

  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-22
          # Hosted runner kernels may use 32 random mmap bits, which ASan can't map.
          sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-fuzz-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Build the fuzz targets
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --target fuzz_parse fuzz_parse_lenient
      - name: Fuzz each target for 60 s, seeded with tests/fuzz/corpus
        run: |
          ./build/fuzz/tests/fuzz_parse tests/fuzz/corpus -max_total_time=60 -print_final_stats=1
          ./build/fuzz/tests/fuzz_parse_lenient tests/fuzz/corpus -max_total_time=60 -print_final_stats=1

  isolation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-isolation-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}
      # Same order as the package job: the Visual Studio environment sets its own VCPKG_ROOT.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: Gate 9
        run: cmake -DONLY=isolation -DSTRICT=ON -P tools/ci.cmake

  packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-packages-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}
      # The Visual Studio environment sets VCPKG_ROOT to its bundled, manifest-only vcpkg, so it
      # goes first and the clone below wins.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Set up vcpkg
        shell: bash
        run: .github/scripts/setup-vcpkg.sh
      - name: vcpkg overlay ports and consumer
        shell: bash
        env:
          NEPDATE_CPP_SOURCE: ${{ github.workspace }}
          VCPKG_KEEP_ENV_VARS: NEPDATE_CPP_SOURCE
        run: |
          set -euo pipefail
          vcpkg_bin="$VCPKG_ROOT/vcpkg"
          consumer="consumer"
          if [ "$RUNNER_OS" = "Windows" ]; then
            vcpkg_bin="$VCPKG_ROOT/vcpkg.exe"
            consumer="consumer.exe"
          fi
          # The repository root has a vcpkg.json, so classic mode must be asked for.
          "$vcpkg_bin" install --classic nepdate-patro --overlay-ports=ports
          for std in 20 23; do
            dir="build/consumer-cxx${std}"
            cmake -S tests/consumer -B "$dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_CXX_STANDARD=$std -DCMAKE_BUILD_TYPE=Release
            cmake --build "$dir"
            "$dir/$consumer"
          done
      - name: Conan recipes
        shell: bash
        env:
          NEPDATE_CPP_SOURCE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pipx install conan==2.34.0  # pinned: the version the recipes were tested with
          conan profile detect --force
          conan create conan/nepdate -s compiler.cppstd=20
          conan create conan/nepdate-patro -s compiler.cppstd=20

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version from the header
        id: version
        run: |
          set -euo pipefail
          # Assigned first: a failing command inside echo's argument would not stop the step.
          if ! version="$(bash scripts/version.sh)"; then
            echo "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Fails when shared/ differs from the hub at the commit in shared/VERSION, and when the
  # libraries' version is on another MAJOR.MINOR line (ADR-0007).
  shared-check:
    needs: version
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@f636b7d476bc5959eb5689a950b73c8943860eef # main 2026-11-01
    with:
      sdk: cpp
      version: ${{ needs.version.outputs.version }}
