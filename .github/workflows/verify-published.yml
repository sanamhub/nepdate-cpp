# Checks a published release the way a user meets it: downloads the assets from the GitHub
# Release, verifies SHA256SUMS, SHA512SUMS and the provenance attestation, then builds the consumer
# (tests/consumer, one conversion, a round trip and one patro lookup) twice on every runner OS:
# with FetchContent from the release URL and its SHA-256, and with find_package from the archive
# built and installed on its own. release.yml calls it after the release exists; it also runs by
# hand for any released version. It needs no checkout: the consumer source comes from the
# downloaded archive, so dispatching this file from main re-verifies any earlier tag.
#
# Scheduled runs keep the release honest after the release page goes quiet. Every Monday one Linux
# runner downloads the newest release and builds the consumer through FetchContent
# (scripts/verify-published.sh), and every day a metadata-only check confirms the release still
# lists its three assets and their URLs answer, without downloading them. A failure opens or
# updates one issue labelled published-check. The check jobs read the release and nothing else;
# only the report job writes.

name: verify-published

on:
  workflow_call:
    inputs:
      version:
        description: Released version, no leading v, or latest for the newest release
        required: false
        default: latest
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version, no leading v, or latest for the newest release
        required: false
        default: latest
        type: string
  schedule:
    # The weekly install check, Monday 10:37 UTC.
    - cron: "37 10 * * 1"
    # The daily metadata check, which downloads no asset.
    - cron: "7 4 * * *"

permissions:
  contents: read
  attestations: read

jobs:
  # One place resolves latest, so every job of a run checks the same version.
  resolve:
    name: resolve the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-latest}"
          if [ "$version" = latest ]; then
            version="$(bash scripts/verify-published.sh latest --resolve)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  # A release or a manual run: the full check, both build paths, on every runner OS.
  verify:
    name: verify ${{ needs.resolve.outputs.version }}
    if: github.event_name != 'schedule'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the release assets
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like X.Y.Z or X.Y.Z-PRERELEASE, got '$VERSION'"
            exit 1
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dl
          ls -l dl
      - name: Checksums and provenance
        run: |
          set -euo pipefail
          archive="nepdate-cpp-$VERSION.tar.gz"
          # macOS has shasum but not always the GNU sha256sum and sha512sum.
          if command -v sha256sum > /dev/null; then
            (cd dl && sha256sum -c SHA256SUMS && sha512sum -c SHA512SUMS)
          else
            (cd dl && shasum -a 256 -c SHA256SUMS && shasum -a 512 -c SHA512SUMS)
          fi
          gh attestation verify "dl/$archive" --repo "$GITHUB_REPOSITORY"
      # CMake on Windows is a native program: it gets C:/... paths from cygpath -m, not the /d/a/...
      # spelling of Git Bash, and the consumer is run by its full .exe name. Each step fails unless
      # the program it built prints "consumer OK", so a skipped or missing run can't pass.
      - name: Paths for this runner
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ROOT=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
            echo "EXE=.exe" >> "$GITHUB_ENV"
          else
            echo "ROOT=$PWD" >> "$GITHUB_ENV"
            echo "EXE=" >> "$GITHUB_ENV"
          fi
      - name: Consumer through FetchContent from the release URL
        run: |
          set -euo pipefail
          archive="nepdate-cpp-$VERSION.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$archive"
          sha256="$(cut -d' ' -f1 dl/SHA256SUMS)"
          mkdir -p fetch && tar -xzf "dl/$archive" -C fetch
          mkdir -p fc
          cp "fetch/nepdate-cpp-$VERSION/tests/consumer/consumer.cpp" fc/
          cat > fc/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.25)
          project(nepdate_fetch_consumer LANGUAGES CXX)
          include(FetchContent)
          FetchContent_Declare(nepdate URL "$url" URL_HASH SHA256=$sha256)
          FetchContent_MakeAvailable(nepdate)
          add_executable(consumer consumer.cpp)
          target_link_libraries(consumer PRIVATE nepdate::nepdate nepdate::patro)
          target_compile_features(consumer PRIVATE cxx_std_20)
          EOF
          cmake -S "$ROOT/fc" -B "$ROOT/fc/build" -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=$ROOT/fc/bin"
          cmake --build "$ROOT/fc/build" --config Release --parallel 2
          ls -l "fc/bin/consumer$EXE"
          out="$("$ROOT/fc/bin/consumer$EXE")"
          echo "$out"
          test "$(echo "$out" | tr -d '\r')" = "consumer OK"
      - name: Consumer through find_package from the installed archive
        run: |
          set -euo pipefail
          src="$ROOT/fetch/nepdate-cpp-$VERSION"
          cmake -S "$src" -B "$ROOT/core-build" -DCMAKE_BUILD_TYPE=Release \
            -DNEPDATE_BUILD_TESTS=OFF -DNEPDATE_BUILD_TOOLS=OFF
          cmake --build "$ROOT/core-build" --config Release --parallel 2
          cmake --install "$ROOT/core-build" --config Release --prefix "$ROOT/prefix"
          cmake -S "$src/tests/consumer" -B "$ROOT/consumer-build" -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$ROOT/prefix" "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=$ROOT/consumer-bin"
          cmake --build "$ROOT/consumer-build" --config Release --parallel 2
          ls -l "consumer-bin/consumer$EXE"
          out="$("$ROOT/consumer-bin/consumer$EXE")"
          echo "$out"
          test "$(echo "$out" | tr -d '\r')" = "consumer OK"
      - name: Step summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### verify-published"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"

  # The weekly check: Linux only, FetchContent from the newest release.
  weekly:
    name: weekly ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '37 10 * * 1'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download, build and run
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -o pipefail
          bash scripts/verify-published.sh "$VERSION" 2>&1 | tee verify.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (weekly)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 verify.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-weekly
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  # The daily check: the release still lists its assets and their URLs answer, with no download.
  metadata:
    name: metadata ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '7 4 * * *'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release listing
        id: check
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash scripts/verify-published.sh "$VERSION" --metadata 2>&1 | tee metadata.log
      - name: Step summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "### verify-published (metadata)"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Result: **$OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the failing output
        if: failure()
        run: tail -n 40 metadata.log > failure.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-metadata
          path: failure.txt
          if-no-files-found: ignore
          retention-days: 7

  # The only job with write access. It reads the artifacts the check jobs kept and opens or updates
  # one issue; it never downloads a release.
  report:
    name: report
    if: failure() && github.event_name == 'schedule'
    needs: [resolve, verify, weekly, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failure-*
          path: failures
      - name: Open or update the issue
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/published-issue.sh nepdate-cpp "${VERSION:-latest}" failures
