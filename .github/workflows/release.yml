# ADR-0005: one tag vX.Y.Z (or vX.Y.Z-PRERELEASE) releases both libraries. On a tag push:
# preflight (the version agrees with the tag and every version location, tools/release_check.cmake),
# the full CI workflow, then the production environment (required reviewer) creates the GitHub
# Release with the changelog section plus install and verification notes, attaches the source
# archive with SHA256SUMS and SHA512SUMS and a provenance attestation, and calls
# verify-published.yml. A tag with a pre-release part becomes a GitHub pre-release. A
# workflow_dispatch run with a `version` input does preflight and CI only; the release job stays
# skipped, so a version can be dry-run before tagging.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to preflight (X.Y.Z or X.Y.Z-beta.1, no leading v)
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Full history, so the tagged commit can be checked against main below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The input reaches the script through env, never through ${{ }} inside run:, so a crafted
      # value can't inject shell. This only gates the characters; release_check.cmake applies the
      # full semver rule and compares every version location.
      - name: Resolve and validate the version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like X.Y.Z or X.Y.Z-PRERELEASE, got '$version' (tag vX.Y.Z)"
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::tag $tag does not match v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Release check
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: cmake "-DVERSION=$VERSION" -P tools/release_check.cmake

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    if: github.ref_type == 'tag'
    needs: [preflight, ci]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive and checksums (includes shared/)
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          archive="nepdate-cpp-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="nepdate-cpp-$VERSION/" -o "dist/$archive" "$GITHUB_REF_NAME"
          cd dist
          sha256sum "$archive" > SHA256SUMS
          sha512sum "$archive" > SHA512SUMS
      - name: Release notes
        # Notes come from the CHANGELOG section, not the commit log, plus how to install this exact
        # version and how to check the download.
        shell: bash
        run: |
          set -euo pipefail
          awk -v want="## [$VERSION] -" '
            /^## \[/ { if (in_section) exit; if (index($0, want) == 1) { in_section = 1; next } }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          archive="nepdate-cpp-$VERSION.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$archive"
          sha256="$(cut -d' ' -f1 dist/SHA256SUMS)"
          {
            echo
            echo "### Install"
            echo
            echo "With CMake \`FetchContent\`, from the archive attached here:"
            echo
            echo '```cmake'
            echo 'include(FetchContent)'
            echo 'FetchContent_Declare(nepdate'
            echo "    URL $url"
            echo "    URL_HASH SHA256=$sha256)"
            echo 'FetchContent_MakeAvailable(nepdate)'
            echo 'target_link_libraries(your_app PRIVATE nepdate::nepdate nepdate::patro)'
            echo '```'
            echo
            echo "Or extract the archive, \`cmake --install\` it, and use \`find_package(nepdate)\` and"
            echo "\`find_package(nepdate-patro)\`. vcpkg and Conan Center listings follow upstream review."
            echo
            echo "### Verification"
            echo
            echo '```bash'
            echo "gh release download $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY"
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify $archive --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "After this release, verify-published downloaded these files, checked both, and built a"
            echo "consumer from the archive on Linux, macOS and Windows."
          } >> release-notes.md
          cat release-notes.md
      - name: The asset set is exactly the archive and its sums
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' "nepdate-cpp-$VERSION.tar.gz" SHA256SUMS SHA512SUMS | sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ holds $(echo "$actual" | tr '\n' ' '), expected $(echo "$expected" | tr '\n' ' ')"
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS && sha512sum -c SHA512SUMS)
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/nepdate-cpp-${{ env.VERSION }}.tar.gz"
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "v${{ env.VERSION }}"
          body_path: release-notes.md
          # A tag with a pre-release part lands as a pre-release, never as the latest version.
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/nepdate-cpp-${{ env.VERSION }}.tar.gz
            dist/SHA256SUMS
            dist/SHA512SUMS

  # Called, not triggered: a release created with GITHUB_TOKEN fires no release event.
  verify-published:
    if: github.ref_type == 'tag'
    needs: [preflight, release]
    permissions:
      contents: read
      attestations: read
      # The called workflow's report job opens an issue when a scheduled check fails; a caller
      # must grant every permission a called job requests.
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
